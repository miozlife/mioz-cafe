# Hugo configuration file
title: Mioz Cafe

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

defaultContentLanguage: 简体中文

menu:
  main:
    - name: 书架
      pageRef: /books
      weight: 1
    - name: 随笔
      pageRef: /inks
      weight: 2
    - name: 关于
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search


params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /logo.png
      dark: /logo.png
      width: 20
      height: 20
      link: /
    width: wide

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"

  description: Sha的书架
  externalLinkDecoration: true

  banner:
    key: 'announcement'
    message:
      🎉 Sha的书架.

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  # Display the last modification info
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: true

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: reverse

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      # Pagination
      pagerSize: 20

    article:
      displayPagination: true

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  page:
    # full (100%), wide (90rem), normal (80rem)
    width: normal
    contextMenu:
      enable: true
      links:
        - name: "Ask DeepSeek"
          url: "https://chat.deepseek.com"
          icon: "chat"
    # tabs:
    #   sync: true

  comments:
    enable: true
    type: twikoo

    # https://twikoo.js.org/
    twikoo:
      # Vercel 部署的 Twikoo 服务地址
      serverUrl: https://twikoo.mioz.life
      lang: zh-CN

  imageZoom:
    enable: true


  archives:
    section: docs
    dateFormat: "Jan 02"